<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading App...</title>
    <script>
        window.onload = function() {
            // Replace these with your actual store URLs
            const playStoreUrl = "https://play.google.com/store/apps/details?id=com.ilive.connect";
            const appStoreUrl = "https://apps.apple.com/in/app/ilive-wellness-care/id6755055154";
            const fallbackUrl = "https://iliveconnect.com/"; // For desktop scans

            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // Route based on operating system
            if (/android/i.test(userAgent)) {
                window.location.href = playStoreUrl;
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = appStoreUrl;
            } else {
                window.location.href = fallbackUrl;
            }
        };
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        Redirecting you to the appropriate app store... <br>
        If it doesn't load, <a href="https://iliveconnect.com/">click here</a>.
    </p>
</body>
</html>
